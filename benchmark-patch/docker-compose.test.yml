# Throwaway SysON instance for round-trip tests (port 8083, its own database).
name: syson-benchmark-test
services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    tmpfs: [/var/lib/postgresql/data]
  app:
    image: "${IMAGE:-syson-benchmark:v2026.9.6-bp1}"
    ports: ["127.0.0.1:8083:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on: [database]
